workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bluffster.game
      vars:
        XCODE_WORKSPACE: "App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/ios @capacitor/cli
      - name: Copy web assets
        script: |
          mkdir -p www
          cp index.html www/
          npx cap sync ios
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/export/*.ipa
    publishing:
      app_store_connect:
        auth: integration
